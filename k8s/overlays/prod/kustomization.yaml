# Overlay PROD — hanya compreface-fe. Namespace compreface (dibuat oleh mega-facecompare-deploy).
# Ganti "registry.example.internal" dengan host registry internal; untuk rilis, sebaiknya pin digest
# (newTag → digest: sha256:...) dari build/digests.txt hasil scripts/push.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: compreface

resources:
  - ../../base
  - pdb.yaml
  # Ingress — contoh, sesuaikan host/TLS/ingressClass sebelum diaktifkan.
  # - ingress.example.yaml

images:
  - name: mega/compreface-fe
    newName: registry.example.internal/mega/compreface-fe
    newTag: "1.2.0"

replicas:
  - name: compreface-fe
    count: 2
